name: Project continuity

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  continuity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate prompt-free project continuity
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python scripts/validate_project_continuity.py

      - name: Validate active documentation consistency
        run: python scripts/validate_documentation_consistency.py
