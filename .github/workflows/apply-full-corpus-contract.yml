name: Apply full-corpus consumer contract

on:
  push:
    branches:
      - feat/full-corpus-consumer-contract
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout contract branch
        uses: actions/checkout@v4
        with:
          ref: feat/full-corpus-consumer-contract
          fetch-depth: 0
          persist-credentials: true

      - name: Apply reviewed non-workflow payload and validate
        shell: bash
        run: |
          set -euo pipefail
          cat .github/full-corpus-contract-payload/part* \
            | base64 --decode \
            > "$RUNNER_TEMP/full-corpus-contract.tar.gz"
          tar -xzf "$RUNNER_TEMP/full-corpus-contract.tar.gz" -C .

          # GitHub's workflow token may not create/update workflow files. Keep
          # workflow changes for the authenticated connector after this push.
          git checkout HEAD -- \
            .github/workflows/repository-checks.yml \
            .github/workflows/sync-bibliography.yml \
            .github/workflows/apply-full-corpus-contract.yml
          rm -rf .github/full-corpus-contract-payload

          python -m compileall -q scripts tests
          python -m unittest discover -s tests -p 'test_*.py' -v

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit \
            -m "feat: add complete bibliography consumer contract" \
            -m "Replace the citation-only consumer with strict complete-corpus and nested citation-ready validation, contextual source-reference checks, trust-aware local search, transactionality tests, and DEC-021 documentation.\n\nValidation: Python compilation and the complete unit-test suite pass before this commit is pushed.\n\nNot changed: workflow files are updated separately by the authenticated connector; no generated bibliography corpus is imported, no source is promoted, and no research protocol or model set is frozen."
          git push origin HEAD:feat/full-corpus-consumer-contract
