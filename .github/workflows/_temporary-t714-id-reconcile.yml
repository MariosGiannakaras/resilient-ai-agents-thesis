name: Temporary T-714 canonical ID reconciliation

on:
  push:
    branches:
      - thesis/t711a-final-hardening
    paths:
      - scripts/_temporary_t714_id_reconcile.py

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: thesis/t711a-final-hardening
          fetch-depth: 0
      - name: Reconcile canonical hardening task ID
        run: python scripts/_temporary_t714_id_reconcile.py
      - name: Commit canonical status files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/context/TASKS.md docs/context/CURRENT_STATUS.md
          git diff --cached --quiet && { echo "Expected T-714 reconciliation change missing"; exit 1; }
          git commit -m "T-714: reconcile canonical hardening task ID"
          git push origin HEAD:thesis/t711a-final-hardening
