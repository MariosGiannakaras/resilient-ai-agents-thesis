name: Audit retained thesis DOCX corpus

on:
  push:
    branches:
      - audit/full-repo-thesis-corpus
    paths:
      - scripts/audit_thesis_docx_corpus.py
      - .github/workflows/audit-thesis-docx-corpus.yml
      - thesis/drafts/**
      - thesis/archive/**
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit all retained thesis DOCX files
        run: python scripts/audit_thesis_docx_corpus.py
      - name: Commit generated persistent audit extracts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/thesis/audits/docx-corpus
          if git diff --cached --quiet; then
            echo "No audit changes"
            exit 0
          fi
          git commit -m "audit: persist retained thesis DOCX corpus report"
          git push origin "HEAD:${GITHUB_REF_NAME}"
