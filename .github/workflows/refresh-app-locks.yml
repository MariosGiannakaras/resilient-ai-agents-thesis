name: Refresh application locks

on:
  push:
    branches:
      - feat/pre-wp7-protocol-v1.1-ui-rebuild
    paths:
      - pyproject.toml
      - frontend/package.json
      - frontend/tsconfig*.json
      - frontend/vite.config.ts
      - frontend/index.html
      - frontend/src/**
      - .github/workflows/refresh-app-locks.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve-and-build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Resolve Python lock
        run: uv lock

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Resolve frontend lock
        working-directory: frontend
        run: npm install --ignore-scripts

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Upload resolved application artifacts
        uses: actions/upload-artifact@v4
        with:
          name: application-locks-and-build
          if-no-files-found: error
          retention-days: 2
          path: |
            uv.lock
            frontend/package-lock.json
            frontend/dist/**
