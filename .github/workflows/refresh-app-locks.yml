name: Refresh application lock

on:
  push:
    branches:
      - feat/pre-wp7-protocol-v1.1-ui-rebuild
    paths:
      - pyproject.toml
      - .github/workflows/refresh-app-locks.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  resolve-lock:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: feat/pre-wp7-protocol-v1.1-ui-rebuild

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Resolve locked Python application environment
        run: uv lock

      - name: Commit lock change when required
        shell: bash
        run: |
          if git diff --quiet -- uv.lock; then
            echo "uv.lock already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git commit -m "chore: refresh application lock"
          git push origin HEAD:feat/pre-wp7-protocol-v1.1-ui-rebuild

      - name: Verify locked environment
        run: uv sync --locked
