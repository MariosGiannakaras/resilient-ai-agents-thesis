name: T-719 final authority thesis audit

on:
  push:
    branches:
      - thesis/t719-final-authority-audit
    paths:
      - scripts/t719_final_authority_audit.py
      - scripts/t719_payload.b64
      - docs/thesis/T719_FINAL_AUTHORITY_AUDIT_PLAN.md
      - docs/context/WORK_STATE.json
      - .github/workflows/t719-final-authority-audit.yml
  pull_request:
    paths:
      - scripts/t719_final_authority_audit.py
      - scripts/t719_payload.b64
      - docs/thesis/T719_FINAL_AUTHORITY_AUDIT_PLAN.md
      - docs/thesis/T719_FINAL_AUTHORITY_AUDIT.md
      - docs/context/WORK_STATE.json
      - thesis/archive/T719_final_authority_audited_review_ready.docx
      - thesis/archive/T719_qa-report.json
      - .github/workflows/t719-final-authority-audit.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install bounded document dependency
        run: python -m pip install --disable-pip-version-check lxml==6.0.1
      - name: Reconstruct exact validated T-719
        run: python scripts/t719_final_authority_audit.py
      - name: Validate immutable correction boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          q=json.loads(Path('artifacts/t719/T719_qa-report.json').read_text(encoding='utf-8'))
          assert q['status']=='pass',q
          assert q['base_raw_sha256']=='60f92b1cb9994ff2964e551d09bf5a9ee14c7a37e30d49b92435bcea90c957de',q
          assert q['output_raw_sha256']=='1529f2b8a69594f164050544a54e1de115acb40a5a0eb6291156d3ecccf1afb9',q
          assert q['changed_ooxml_entries']==['word/document.xml','word/styles.xml'],q
          assert q['media_count']==q['unchanged_media_count']==25,q
          assert q['bibliography_identity_count']==32 and q['citation_first_appearance_sequential'] is True,q
          assert q['toc_entry_count']==139 and q['figure_list_entry_count']==24 and q['table_list_entry_count']==3,q
          assert q['rendered_page_count']==101 and q['full_visual_qa']=='PASS_101_PAGES',q
          assert q['scientific_results_modified'] is False,q
          assert q['protocol_or_estimand_modified'] is False,q
          assert q['new_experiment_or_reanalysis'] is False,q
          assert q['declaration_placeholder_preserved'] is True,q
          print('T-719 exact validated artifact reproduced')
          PY
      - name: Archive exact validated milestone
        if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
        run: |
          cp artifacts/t719/T719_final_authority_audited_review_ready.docx thesis/archive/T719_final_authority_audited_review_ready.docx
          cp artifacts/t719/T719_qa-report.json thesis/archive/T719_qa-report.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add thesis/archive/T719_final_authority_audited_review_ready.docx thesis/archive/T719_qa-report.json
          if git diff --cached --quiet; then
            echo 'T-719 archive already current.'
          else
            git commit -m 'T-719: archive validated final-authority milestone'
            git push
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: t719-final-authority-candidate
          path: |
            artifacts/t719/T719_final_authority_audited_review_ready.docx
            artifacts/t719/T719_qa-report.json
          if-no-files-found: error
          retention-days: 30
