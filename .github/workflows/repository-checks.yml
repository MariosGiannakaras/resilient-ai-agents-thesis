name: Repository checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  sanity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv

      - name: Verify locked environment
        run: |
          uv lock --check
          uv sync --locked

      - name: Reject unresolved merge markers
        shell: bash
        run: |
          if git grep -nE '^(<<<<<<<|>>>>>>>)( |$)' -- .; then
            echo "Unresolved merge markers found."
            exit 1
          fi

      - name: Compile Python sources
        run: uv run python -m compileall -q scripts tests src core

      - name: Validate documentation consistency
        run: uv run python scripts/validate_documentation_consistency.py

      - name: Run tests
        run: uv run python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Validate installed bibliography when present
        shell: bash
        run: |
          if [ -f research/bibliography/IMPORT_INTEGRITY.json ]; then
            uv run python scripts/bibliography_import.py --validate-only
            uv run python scripts/validate_bibliography_usage.py
            (cd research/bibliography && sha256sum -c catalog/SHA256SUMS)
            (cd research/bibliography/citation-ready && sha256sum -c catalog/SHA256SUMS)
          else
            echo "No generated bibliography import is committed yet."
          fi

      - name: Validate committed JSON files
        shell: bash
        run: |
          uv run python - <<'PY'
          import json
          from pathlib import Path
          for path in Path('.').rglob('*.json'):
              if '.git' in path.parts or '.cache' in path.parts:
                  continue
              with path.open(encoding='utf-8') as handle:
                  json.load(handle)
              print(f'valid: {path}')
          PY
