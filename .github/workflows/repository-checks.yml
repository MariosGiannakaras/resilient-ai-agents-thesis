name: Repository checks

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - "results/**"
      - "artifacts/**"

permissions:
  contents: read

concurrency:
  group: repository-checks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sanity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false

      - name: Reject unresolved merge markers
        shell: bash
        run: |
          if git grep -nE '^(<<<<<<<|>>>>>>>)( |$)' -- .; then
            echo "Unresolved merge markers found."
            exit 1
          fi

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate documentation consistency
        run: python scripts/validate_documentation_consistency.py

      - name: Validate committed JSON files
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          validated = 0
          for path in Path('.').rglob('*.json'):
              if '.git' in path.parts or '.cache' in path.parts:
                  continue
              try:
                  with path.open(encoding='utf-8') as handle:
                      json.load(handle)
              except (OSError, UnicodeError, json.JSONDecodeError) as exc:
                  raise RuntimeError(f"invalid committed JSON: {path}") from exc
              validated += 1
          print(f"Validated {validated} committed JSON files.")
          PY

      - name: Compile Python sources
        run: python -m compileall -q scripts tests src

      - name: Install uv
        run: python -m pip install --disable-pip-version-check --quiet uv

      - name: Verify locked environment
        run: |
          uv lock --check
          uv sync --locked --no-progress

      - name: Run tests
        run: uv run python -m unittest discover -s tests -p 'test_*.py' -q

      - name: Validate installed bibliography when present
        shell: bash
        run: |
          if [ -f research/bibliography/IMPORT_INTEGRITY.json ]; then
            uv run python scripts/bibliography_import.py --validate-only
            uv run python scripts/validate_bibliography_usage.py
            (cd research/bibliography && sha256sum --quiet -c catalog/SHA256SUMS)
            (cd research/bibliography/citation-ready && sha256sum --quiet -c catalog/SHA256SUMS)
          else
            echo "No generated bibliography import is committed yet."
          fi
