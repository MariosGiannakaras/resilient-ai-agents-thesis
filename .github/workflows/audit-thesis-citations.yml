name: Audit thesis citation coverage

on:
  push:
    branches:
      - audit/full-repo-thesis-corpus
    paths:
      - scripts/audit_thesis_citations.py
      - .github/workflows/audit-thesis-citations.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit citation coverage
        run: python scripts/audit_thesis_citations.py
      - name: Commit report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/thesis/audits/docx-corpus/citation-audit.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "audit: persist thesis citation coverage report"
          git push origin "HEAD:${GITHUB_REF_NAME}"
