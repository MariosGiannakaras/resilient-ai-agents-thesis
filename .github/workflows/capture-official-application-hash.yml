name: Capture official application checksum

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checksum:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Hash official application repository copy
        run: |
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path

          path = Path('thesis/source-material/GiannakarasMariosThesisApplication.pdf')
          payload = path.read_bytes()
          if not payload.startswith(b'%PDF-'):
              raise SystemExit('Official application file does not have a PDF signature.')
          print(f'APPLICATION_SHA256={sha256(payload).hexdigest()}')
          print(f'APPLICATION_SIZE_BYTES={len(payload)}')
          PY
