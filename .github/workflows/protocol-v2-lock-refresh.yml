name: Protocol-v2 lock refresh

on:
  push:
    branches:
      - feat/pre-wp7-protocol-v1.1-ui-rebuild
    paths:
      - pyproject.toml

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/pre-wp7-protocol-v1.1-ui-rebuild
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install --disable-pip-version-check --quiet uv
      - name: Refresh lockfile
        run: uv lock
      - name: Commit refreshed lockfile
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- uv.lock; then
            echo "uv.lock is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git commit -m "chore: lock protocol-v2 pilot dependencies"
          git push origin HEAD:feat/pre-wp7-protocol-v1.1-ui-rebuild
