name: T-711/T-714/T-715 thesis DOCX QA

on:
  pull_request:
    paths:
      - "scripts/build_review_ready_thesis_docx.py"
      - "scripts/t711_build_entry.py"
      - "scripts/t711_build_entry_v2.py"
      - "scripts/t711_build_entry_v3.py"
      - "scripts/t711_build_entry_v4.py"
      - "scripts/t711_build_entry_v5.py"
      - "scripts/t711_build_entry_v6.py"
      - "scripts/t711_build_entry_v7.py"
      - "scripts/t711_build_entry_v8.py"
      - "scripts/t711_build_entry_v9.py"
      - "scripts/t711_build_entry_v10.py"
      - "scripts/t711_build_entry_v11.py"
      - "scripts/t711_build_entry_v12.py"
      - "scripts/t711_build_entry_v13.py"
      - "scripts/t711_build_entry_v14.py"
      - "scripts/t711_build_entry_v15.py"
      - "scripts/t711_build_entry_v16.py"
      - "scripts/t711_build_entry_v17.py"
      - "scripts/t711_build_entry_v18.py"
      - "scripts/t711_build_entry_v19.py"
      - "scripts/t711_build_entry_v20.py"
      - "scripts/t711_build_entry_v21.py"
      - "scripts/t711_build_entry_v22.py"
      - "scripts/t711_build_entry_v23.py"
      - "scripts/t711_build_entry_v24.py"
      - "scripts/t711_build_entry_v25.py"
      - "scripts/t711_build_entry_v26.py"
      - "scripts/t711_build_entry_v27.py"
      - "scripts/t715_reader_expansions.py"
      - "scripts/t715_audit_hardening.py"
      - "scripts/render_ui_screenshots.py"
      - "src/resilient_agents/desktop/**"
      - "requirements/application-ui.txt"
      - "configs/protocols/protocol-v2.1-final.json"
      - "docs/thesis/draft/**"
      - "research/bibliography/citation-ready/**"
      - "results/thesis-assets/protocol-v2.1-final/**"
      - ".github/workflows/t711-thesis-docx.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-docx:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned document dependencies
        run: python -m pip install --disable-pip-version-check python-docx==1.2.0 Pillow==11.3.0 uv

      - name: Prepare deterministic UI-render environment
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libegl1
          uv sync --locked --group gridworld-prototype --no-progress
          uv pip install --python .venv/bin/python --requirement requirements/application-ui.txt

      - name: Render DEVELOPMENT-only application screenshots
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONPATH: src
        run: |
          uv run --no-sync python scripts/render_ui_screenshots.py --output artifacts/t715-ui
          test -f artifacts/t715-ui/03-run-phase-a-1440x900.png
          test -f artifacts/t715-ui/04-run-phase-b-frozen-adaptive-1440x900.png

      - name: Build audit-reconciled reader thesis
        env:
          T715_UI_SCREENSHOT_DIR: artifacts/t715-ui
        run: |
          python scripts/t711_build_entry_v27.py \
            --output artifacts/t711/resilient-ai-agents-thesis-review-ready.docx \
            --qa-output artifacts/t711/qa-report.json

      - name: Inspect structural and academic QA
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          qa_path = Path("artifacts/t711/qa-report.json")
          docx_path = Path("artifacts/t711/resilient-ai-agents-thesis-review-ready.docx")
          report = json.loads(qa_path.read_text(encoding="utf-8"))
          actual_sha = hashlib.sha256(docx_path.read_bytes()).hexdigest()

          assert report["status"] == "pass", report
          assert report["output_sha256"] == actual_sha, (report["output_sha256"], actual_sha)
          assert report.get("final_artifact_metadata_reconciled") is True, report
          assert report.get("t711a_hardening_version") == 18, report
          assert report.get("t715_reader_scope_simplification") is True, report
          assert report.get("t715_detailed_scientific_source_preserved") is True, report
          assert report.get("t715_v13_length_guard_rebased") is True, report
          assert report.get("t715_v13_paragraph_floor") == 380, report
          assert report.get("t715_v14_wording_guard_rebased") is True, report
          assert report.get("t715_expected_neutral_wording_replacements") == 2, report
          assert report.get("t715_figure_numbering_preserved") is True, report
          assert report.get("t715_main_registered_figure_count") == 10, report
          assert report.get("t715_appendix_registered_figure_count") == 14, report
          assert report.get("t715_total_registered_figure_count") == 24, report
          assert not report.get("t715_main_forbidden_internal_detail"), report
          assert report.get("t715_main_word_count_approx", 0) >= 7500, report
          assert report.get("t715_main_word_count_approx", 0) <= 18000, report
          assert report.get("t715_secondary_diagnostics_moved_to_appendix") == [
              "FIG-RQ3-019-CONDITIONAL",
              "FIG-RQ3-023-SENSITIVITY",
          ], report
          assert report.get("t715_application_screenshots_added") is True, report
          assert report.get("t715_application_screenshot_count") == 2, report
          assert report.get("t715_application_screenshot_names") == [
              "03-run-phase-a-1440x900.png",
              "04-run-phase-b-frozen-adaptive-1440x900.png",
          ], report
          assert report.get("t715_application_capture_development_only") is True, report
          assert report.get("t715_application_capture_scientific_jobs_executed") == 0, report
          assert report.get("t715_application_capture_environment_steps_executed") == 0, report
          assert report.get("t715_application_capture_final_reserve_accessed") is False, report
          assert report.get("t715_application_screenshots_scientific_evidence") is False, report
          assert report.get("t715_preexisting_docx_media_preserved") is True, report
          assert report.get("t715_new_docx_media_count") == 2, report
          assert report.get("t715_new_docx_media_hashes_match_screenshots") is True, report
          assert report.get("t715_inline_shape_count_before_app_screenshots") == 25, report
          assert report.get("t715_final_inline_shape_count") == 27, report
          assert report.get("t715_final_image_alt_text_count") == 27, report

          assert report.get("t715_audit_hardening_applied") is True, report
          assert report.get("t715_audit_hardening_version") == 1, report
          assert report.get("t715_audit_hardening_inserted_paragraph_count") == 26, report
          assert report.get("t715_audit_hardening_inserted_heading_count") == 3, report
          assert report.get("t715_audit_hardening_paragraph_delta") == 26, report
          assert all(v == 1 for v in report.get("t715_audit_hardening_sentinel_counts", {}).values()), report
          assert report.get("t715_audit_hardening_media_preserved") is True, report
          assert report.get("t715_audit_hardening_inline_shapes_preserved") is True, report
          assert report.get("t715_tuning_unit_count") == 180, report
          assert report.get("t715_tuning_candidate_count_per_method") == 6, report
          assert report.get("t715_tuning_root_count") == 3, report
          assert report.get("t715_tuning_layout_count") == 2, report
          assert report.get("t715_tuning_winners") == ["q-c06", "sarsa-c06", "dqn-c05", "ppo-c06", "dyna-c03"], report
          assert report.get("t715_final_root_count") == 12, report
          assert report.get("t715_root_count_candidates") == [12, 16, 20, 24], report
          assert report.get("t715_root_count_max_half_width") == 0.1428, report
          assert report.get("t715_recovery_window_size") == 32, report
          assert report.get("t715_recovery_horizon") == 256, report
          assert report.get("t715_recovery_tolerance") == 0.10, report
          assert report.get("t715_recovery_stability_windows") == 2, report
          assert report.get("t715_action_failure_probability") == 0.15, report
          assert report.get("t715_action_failure_step_reward") == -0.1, report
          assert report.get("t715_observation_corruption_probability") == 0.05, report
          assert report.get("t715_observation_corruption_excludes_true_state") is True, report
          assert report.get("t715_observation_corruption_excludes_goal") is False, report
          assert report.get("t715_layout_generation_seeds") == [57001, 57002], report
          assert report.get("t715_new_posthoc_binomial_test_added") is False, report
          assert report.get("t715_new_experiment_or_reanalysis") is False, report

          assert report.get("chapter4_flow_keep_together_applied") is True, report
          assert report.get("chapter4_flow_match_count") == 1, report
          assert report.get("canonical_results_source_synchronized") is True, report
          assert report.get("canonical_results_source_sha256") == "ba0dea0f8d46e3369dc22a3b18ca806b7ccbbe909e1592a3f21c193a703f2699", report
          assert report.get("results_synthesis_source_sha256") == report.get("canonical_results_source_sha256"), report
          assert report.get("blank_page_pagination_repair") is True, report
          assert report.get("front_matter_explicit_breaks_removed") == sorted(["Γλωσσάριο και Ακρωνύμια", "Κατάλογος Πινάκων", "Κατάλογος Σχημάτων"]), report
          assert not report.get("unstable_front_matter_pagebreak_residue"), report
          assert report.get("glossary_term_count") == 24, report
          assert report.get("glossary_terms_keep_with_next") is True, report
          assert not report.get("glossary_terms_without_keep_with_next"), report
          assert report.get("t711a_reader_text_rescanned_after_save") is True, report
          assert report.get("paragraph_count") == report.get("post_synthesis_paragraph_count"), report
          assert report.get("paragraph_count", 0) >= 406, report
          assert report["citation_count"] == report["verified_reference_identity_count"] == 17, report
          assert report.get("expected_reference_count") == 17, report
          assert report.get("targeted_related_work_citations_present") is True, report
          assert report["planned_figure_count"] == report["inserted_asset_count"] == 24, report
          assert report["cached_figure_entry_count"] == report["inserted_asset_count"] == 24, report
          assert report.get("table_count") == report.get("rendered_table_count") == 4, report
          assert report.get("cached_table_entry_count") == 3, report
          assert report.get("numbered_table_caption_count") == 3, report
          assert report.get("glossary_table_unnumbered") is True, report
          assert report.get("appendix_config_table_present") is True, report
          assert report.get("removed_review_application_appendix") is True, report
          assert report.get("bibliography_normalized_count") == 17, report
          assert report.get("academic_order_valid") is True, report
          assert report.get("academic_heading_replacement_count", 0) >= 35, report
          assert report.get("neutral_wording_replacement_count") == 2, report
          assert not report.get("forbidden_superiority_wording"), report
          assert report.get("presentation_repaired_assets") == ["FIG-METHOD-027-RQ-MAP"], report
          assert report.get("registered_asset_bytes_modified") is False, report
          assert report.get("embedded_media_bytes_preserved") is True, report
          assert report.get("scientific_values_modified") is False, report
          assert report.get("reader_text_rescanned_after_save") is True, report
          assert report.get("removed_appendix_handoff_count") == 14, report
          assert not report.get("reader_visible_asset_id_residue"), report
          assert report.get("results_synthesis_infographic") is True, report
          assert report.get("results_synthesis_numbered_figure") is False, report
          assert report.get("registered_figure_count_preserved") is True, report
          assert report.get("inline_shape_count_after_synthesis") == 25, report
          assert report.get("dqn_foundation_citation_wording_corrected") is True, report
          assert not report.get("superiority_wording_residue"), report
          assert report.get("localized_figure_caption_count") == 24, report
          assert report.get("localized_cached_figure_entry_count") == 24, report
          assert report.get("rq3_conditional_recovery_note_added") is True, report
          assert report.get("image_alt_text_count") == 25, report
          assert report.get("docx_core_metadata_scrubbed") is True, report
          assert not report.get("generator_metadata_residue"), report
          assert report.get("final_mode") is False, report
          assert report.get("final_submission_ready") is False, report
          assert report.get("placeholder_count") == 3, report
          assert report.get("review_placeholders_expected") is True, report
          assert report.get("final_visual_qa_required") is True, report
          assert not report["unresolved_src_ids"], report
          assert not report["contains_drafting_notes"], report
          assert not report.get("corrupt_math_tokens"), report
          assert not report.get("missing_planned_figure_ids"), report
          assert not report.get("unexpected_inserted_figure_ids"), report
          assert not report.get("duplicate_inserted_figure_ids"), report
          assert not report.get("bad_reference_phrases"), report
          print(
              f"T-715 QA: main_words~{report['t715_main_word_count_approx']} "
              f"main_figures={report['t715_main_registered_figure_count']} "
              f"appendix_figures={report['t715_appendix_registered_figure_count']} "
              f"app_screenshots={report['t715_application_screenshot_count']} "
              f"audit_paragraphs={report['t715_audit_hardening_inserted_paragraph_count']} "
              f"citations={report['citation_count']} tables={report['table_count']} "
              f"placeholders={report['placeholder_count']} sha={actual_sha}"
          )
          PY

      - name: Upload review artifact
        uses: actions/upload-artifact@v4
        with:
          name: t715-reader-scoped-review-thesis
          path: |
            artifacts/t711/
            artifacts/t715-ui/manifest.json
            artifacts/t715-ui/03-run-phase-a-1440x900.png
            artifacts/t715-ui/04-run-phase-b-frozen-adaptive-1440x900.png
          if-no-files-found: error
          retention-days: 30
