name: Validate bibliography import

on:
  pull_request:
    paths:
      - "research/bibliography/**"
      - "scripts/bibliography_import.py"
      - "scripts/validate_bibliography_usage.py"
      - "tests/test_bibliography_import.py"
      - ".github/workflows/sync-bibliography.yml"
      - ".github/workflows/validate-bibliography-import.yml"
  push:
    branches: [main]
    paths:
      - "research/bibliography/**"
      - "scripts/bibliography_import.py"
      - "scripts/validate_bibliography_usage.py"
      - "tests/test_bibliography_import.py"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile bibliography tooling
        run: >-
          python -m py_compile
          scripts/bibliography_import.py
          scripts/validate_bibliography_usage.py
          tests/test_bibliography_import.py

      - name: Run bibliography contract tests
        run: python -m unittest tests.test_bibliography_import -v

      - name: Validate generated bibliography when present
        shell: bash
        run: |
          if [ -f research/bibliography/SOURCE_COMMIT ]; then
            python scripts/validate_bibliography_usage.py
          else
            echo "No generated bibliography import is committed yet; contract tests only."
          fi
