name: Temporary T-711A task reconciliation

on:
  push:
    branches:
      - thesis/t711a-final-hardening
    paths:
      - scripts/_temporary_t711a_task_reconcile.py

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: thesis/t711a-final-hardening
          fetch-depth: 1

      - name: Reconcile canonical ledger
        run: python scripts/_temporary_t711a_task_reconcile.py

      - name: Commit reconciliation
        run: |
          if git diff --quiet -- docs/context/TASKS.md; then
            echo "No task-ledger change produced"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/context/TASKS.md
          git commit -m "Reconcile T-711 and T-711A canonical task state"
          git push origin HEAD:thesis/t711a-final-hardening
