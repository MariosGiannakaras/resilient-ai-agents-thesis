name: PySide6 UI acceptance renders

on:
  pull_request:
    paths:
      - "src/resilient_agents/desktop/**"
      - "scripts/render_ui_screenshots.py"
      - "scripts/render_ui_resilience_pair.py"
      - "tests/test_desktop_*.py"
      - "tests/test_t534_*.py"
      - "tests/test_t535_*.py"
      - "tests/test_t536_*.py"
      - "configs/protocols/protocol-v2.1-final.json"
      - "requirements/application-ui.txt"
      - ".github/workflows/ui-screenshots.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pyside6-ui-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONPATH: src
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Qt offscreen runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libegl1

      - name: Install uv
        run: python -m pip install --disable-pip-version-check --quiet uv

      - name: Restore locked project environment
        run: uv sync --locked --group gridworld-prototype --no-progress

      - name: Overlay exact-pinned application UI dependencies
        run: uv pip install --python .venv/bin/python --requirement requirements/application-ui.txt

      - name: Validate desktop and experiment-first UI contracts
        run: |
          uv run --no-sync python -m unittest discover -s tests -p 'test_desktop_*.py' -v
          uv run --no-sync python -m unittest discover -s tests -p 'test_t534_*.py' -v
          uv run --no-sync python -m unittest discover -s tests -p 'test_t535_*.py' -v
          uv run --no-sync python -m unittest discover -s tests -p 'test_t536_*.py' -v

      - name: Render deterministic review screenshots
        run: uv run --no-sync python scripts/render_ui_screenshots.py --output ci-ui-screenshots

      - name: Validate exact matched Frozen/Adaptive render
        run: uv run --no-sync python scripts/render_ui_resilience_pair.py --output ci-ui-screenshots

      - name: Upload UI review renders
        uses: actions/upload-artifact@v4
        with:
          name: pyside6-ui-review-${{ github.sha }}
          path: ci-ui-screenshots/
          if-no-files-found: error
          retention-days: 14
