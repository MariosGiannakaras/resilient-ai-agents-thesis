name: Temporary T-714 Chapter 2 orphan-page fix

on:
  push:
    branches:
      - thesis/t711a-final-hardening
    paths:
      - scripts/_temporary_t714_ch2_orphan_fix.py

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: thesis/t711a-final-hardening
          fetch-depth: 0
      - name: Apply exact Chapter 2 edit
        run: python scripts/_temporary_t714_ch2_orphan_fix.py
      - name: Commit canonical Chapter 2 edit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/thesis/draft/CHAPTER_02_BACKGROUND_RELATED_WORK.md
          git diff --cached --quiet && { echo "Expected Chapter 2 change missing"; exit 1; }
          git commit -m "T-714: eliminate Chapter 2 orphan page"
          git push origin HEAD:thesis/t711a-final-hardening
