name: T-717 pre-freeze content refinement

on:
  push:
    branches:
      - thesis/t717-final-content-refinement
    paths:
      - "scripts/t717_branch_reconcile.py"
      - "scripts/t717_final_content_refinement.py"
      - "scripts/t717_snippets.b64"
      - ".github/workflows/t717-pre-freeze-content-refinement.yml"
      - "docs/context/WORK_STATE.json"
      - "docs/context/TASKS.md"
      - "docs/context/CURRENT_STATUS.md"
      - "docs/thesis/claim-evidence-map.json"
      - "docs/thesis/CLAIM_EVIDENCE_TREE.md"
      - "thesis/archive/T716_stage4_evidence_audited_review_ready.docx"
      - "thesis/archive/T717_pre_freeze_content_refined_review_ready.docx"
      - "thesis/archive/T717_pre_freeze_content_refined_qa.json"

permissions:
  contents: write

concurrency:
  group: t717-pre-freeze-${{ github.ref }}
  cancel-in-progress: false

jobs:
  reconcile-build-validate-persist:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install locked environment and pinned document-build dependencies
        run: |
          python -m pip install --disable-pip-version-check --quiet uv
          uv sync --locked --group gridworld-prototype --no-progress
          python -m pip install --disable-pip-version-check --quiet lxml==6.1.1 matplotlib==3.10.8

      - name: Reconcile T-717 active authorities and claim governance
        run: python scripts/t717_branch_reconcile.py

      - name: Build and validate deterministic T-717 DOCX
        run: python scripts/t717_final_content_refinement.py

      - name: Validate claim registry
        run: uv run python scripts/validate_claim_evidence_map.py

      - name: Validate prompt-free continuity and documentation
        run: |
          uv run python scripts/validate_project_continuity.py
          uv run python scripts/validate_documentation_consistency.py

      - name: Verify persisted DOCX contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          q = json.loads(Path('thesis/archive/T717_pre_freeze_content_refined_qa.json').read_text(encoding='utf-8'))
          expected = {
              'status': 'pass',
              'reference_count': 32,
              'references_used': '32/32',
              'media_count': 25,
              'unchanged_prior_media': 23,
              'seq_fields': 27,
              'toc_fields': 3,
              'page_fields': 1,
              'comments_xml': 0,
              'tracked_insertions': 0,
              'tracked_deletions': 0,
              'unresolved_src_residue': False,
              'scientific_results_modified': False,
              'new_experiment_or_reanalysis': False,
              'ui_screenshot_added': False,
          }
          bad = {k:(q.get(k),v) for k,v in expected.items() if q.get(k) != v}
          if bad:
              raise SystemExit(f'T-717 QA mismatch: {bad}')
          print('T-717 persisted DOCX contract passed:', q['output_raw_sha256'])
          PY

      - name: Verify second build is byte-identical
        run: |
          rm -rf /tmp/t717-second
          mkdir -p /tmp/t717-second
          python scripts/t717_final_content_refinement.py \
            --out /tmp/t717-second/T717.docx \
            --qa /tmp/t717-second/T717.json \
            --asset-dir /tmp/t717-second/assets
          cmp thesis/archive/T717_pre_freeze_content_refined_review_ready.docx /tmp/t717-second/T717.docx
          echo "Second deterministic DOCX build is byte-identical."

      - name: Upload exact review artifact
        uses: actions/upload-artifact@v4
        with:
          name: t717-pre-freeze-review-ready
          path: |
            thesis/archive/T717_pre_freeze_content_refined_review_ready.docx
            thesis/archive/T717_pre_freeze_content_refined_qa.json
          if-no-files-found: error
          retention-days: 30

      - name: Persist canonical T-717 checkpoint
        shell: bash
        run: |
          if git diff --quiet -- \
            docs/context/WORK_STATE.json \
            docs/context/TASKS.md \
            docs/context/CURRENT_STATUS.md \
            docs/thesis/claim-evidence-map.json \
            docs/thesis/CLAIM_EVIDENCE_TREE.md \
            thesis/archive/T717_pre_freeze_content_refined_review_ready.docx \
            thesis/archive/T717_pre_freeze_content_refined_qa.json; then
            echo "T-717 checkpoint already canonical; no commit required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/context/WORK_STATE.json \
            docs/context/TASKS.md \
            docs/context/CURRENT_STATUS.md \
            docs/thesis/claim-evidence-map.json \
            docs/thesis/CLAIM_EVIDENCE_TREE.md \
            thesis/archive/T717_pre_freeze_content_refined_review_ready.docx \
            thesis/archive/T717_pre_freeze_content_refined_qa.json
          git commit -m "T-717: persist reproducible pre-freeze thesis refinement"
          git push origin HEAD:thesis/t717-final-content-refinement
