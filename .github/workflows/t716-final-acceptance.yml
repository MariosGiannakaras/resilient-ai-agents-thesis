name: T-716 final acceptance

on:
  push:
    branches:
      - thesis/t716-final-acceptance
    paths:
      - AGENTS.md
      - docs/context/WORK_STATE.json
      - scripts/project_checkpoint.py
      - scripts/validate_project_continuity.py
      - scripts/t010_install_self_resuming_workflow.py
      - scripts/t716_final_acceptance_audit.py
      - scripts/t716_final_reconcile_claim_registry.py
      - .github/workflows/t716-final-acceptance.yml
  pull_request:
    paths:
      - AGENTS.md
      - README.md
      - docs/context/**
      - docs/thesis/**
      - scripts/project_checkpoint.py
      - scripts/validate_project_continuity.py
      - scripts/t010_install_self_resuming_workflow.py
      - scripts/t716_final_acceptance_audit.py
      - scripts/t716_final_reconcile_claim_registry.py
      - .github/workflows/t716-final-acceptance.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned DOCX dependency
        run: python -m pip install --disable-pip-version-check python-docx==1.2.0

      - name: Harden one-time T-010 migration helper
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/t010_install_self_resuming_workflow.py')
          text = p.read_text(encoding='utf-8')
          replacements = {
              'r"^- \\*\\*Exact next action:\\*\\*.*$"': 'r"^- .*Exact next action.*$"',
              'flags=re.DOTALL | re.MULTILINE)': 'flags=re.MULTILINE)',
              'if "`T-010`" not in text:': 'if "- [ ] IN_PROGRESS `T-010`" not in text:',
          }
          for old, new in replacements.items():
              if old in text:
                  text = text.replace(old, new, 1)
              elif new not in text:
                  raise SystemExit(f'T-010 migration pattern not found: {old}')
          p.write_text(text, encoding='utf-8')
          PY

      - name: Install prompt-free self-resuming workflow state
        run: python scripts/t010_install_self_resuming_workflow.py

      - name: Reconcile final claim registry
        run: python scripts/t716_final_reconcile_claim_registry.py

      - name: Validate claim-evidence registry
        run: python scripts/validate_claim_evidence_map.py

      - name: Run final T-716 acceptance audit
        run: python scripts/t716_final_acceptance_audit.py

      - name: Verify audit result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('artifacts/t716/T716_final_acceptance_audit.json')
          r=json.loads(p.read_text(encoding='utf-8'))
          assert r['status']=='pass' and r['t716_complete'] is True, r
          assert r['package_content_sha256']=='b01f853af794e596f0dfb491a3f5401365ca3f01fd7d410194e539f0b8a10cc1', r
          assert r['word_count']==25327 and r['main_body_word_count']==23273, r
          assert r['paragraph_count']==766 and r['page_count']==92, r
          assert r['reference_count']==31 and r['used_reference_numbers']==list(range(1,32)), r
          assert all(r['acceptance_gates'].values()), r
          assert r['missing_citation_ready_source_ids']==[], r
          assert r['reference_identity_failures']==[], r
          assert r['registry_missing_source_ids']==[], r
          assert len(r['intentional_administrative_placeholders'])==3, r
          assert r['comments_present'] is False and r['tracked_changes_present'] is False, r
          print('T-716 final acceptance: PASS')
          PY

      - name: Validate project continuity
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python scripts/validate_project_continuity.py

      - name: Validate documentation consistency
        run: python scripts/validate_documentation_consistency.py

      - name: Verify reconciliation is idempotent
        run: |
          git diff --binary > /tmp/before.diff
          python scripts/t010_install_self_resuming_workflow.py
          python scripts/t716_final_reconcile_claim_registry.py
          git diff --binary > /tmp/after.diff
          cmp /tmp/before.diff /tmp/after.diff

      - name: Persist final acceptance and continuity migration
        if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
        run: |
          cp artifacts/t716/T716_FINAL_ACCEPTANCE_AUDIT.md docs/thesis/T716_FINAL_ACCEPTANCE_AUDIT.md
          cp artifacts/t716/T716_final_acceptance_audit.json docs/thesis/T716_FINAL_ACCEPTANCE_AUDIT.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Acceptance and self-resuming workflow state already current.'
          else
            git commit -m 'T-010: persist prompt-free self-resuming workflow'
            git push
          fi

      - name: Upload final acceptance audit
        uses: actions/upload-artifact@v4
        with:
          name: t716-final-acceptance
          path: |
            artifacts/t716/T716_FINAL_ACCEPTANCE_AUDIT.md
            artifacts/t716/T716_final_acceptance_audit.json
          if-no-files-found: error
          retention-days: 30
