name: Apply byte-preserved PDF control fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/byte-preserved-pdf-controls
          fetch-depth: 0
          persist-credentials: true

      - name: Apply reviewed payload and validate
        shell: bash
        run: |
          set -euo pipefail
          # The payload is split into deterministic bounded chunks solely for
          # connector transport; it expands to the reviewed seven-file diff.
          cat .github/control-fix-payload/part* | base64 --decode > "$RUNNER_TEMP/fix.tar.gz"
          tar -xzf "$RUNNER_TEMP/fix.tar.gz" -C .
          rm -rf .github/control-fix-payload

          python -m compileall -q scripts tests core
          python -m unittest discover -s tests -p 'test_*.py' -v

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit \
            -m "fix: preserve canonical PDF-extraction controls" \
            -m "Accept low PDF-extraction control characters only in canonical sources/*.md and materials/*.md, preserve imported bytes and upstream checksums, record exact path/code-point counts in IMPORT_INTEGRITY.json, and normalize only deterministic search text. Trust-sensitive layers remain strict and NUL is still rejected outside the bounded full-text exception.\n\nValidation: Python compilation and the complete repository test suite pass before push."
          git push origin HEAD:fix/byte-preserved-pdf-controls
