name: Sync complete thesis research corpus

on:
  workflow_dispatch:
    inputs:
      bibliography_ref:
        description: Immutable ThesisBibliography tag or full commit SHA
        required: true
        type: string
  push:
    branches: [main]
    paths:
      - ".bibliography-sync-trigger"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: bibliography-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout thesis repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv

      - name: Verify locked thesis environment
        run: |
          uv lock --check
          uv sync --locked

      - name: Resolve requested immutable bibliography ref
        id: request
        shell: bash
        env:
          DISPATCH_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.bibliography_ref || '' }}
        run: |
          set -euo pipefail
          if [ -n "$DISPATCH_REF" ]; then
            requested_ref="$DISPATCH_REF"
          else
            requested_ref="$(sed -n 's/^bibliography_ref=//p' .bibliography-sync-trigger | tail -n 1)"
          fi
          if [ -z "$requested_ref" ]; then
            echo "::error::An explicit immutable bibliography tag or full SHA is required."
            exit 1
          fi
          if [ "$requested_ref" = "main" ] || [ "$requested_ref" = "master" ] || [ "$requested_ref" = "HEAD" ]; then
            echo "::error::Mutable branch/default refs are forbidden for production synchronization."
            exit 1
          fi
          echo "ref=$requested_ref" >> "$GITHUB_OUTPUT"

      - name: Verify read-only bibliography credential
        env:
          BIBLIOGRAPHY_SYNC_TOKEN: ${{ secrets.BIBLIOGRAPHY_SYNC_TOKEN }}
          GH_TOKEN: ${{ secrets.BIBLIOGRAPHY_SYNC_TOKEN }}
          BIBLIOGRAPHY_REF: ${{ steps.request.outputs.ref }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$BIBLIOGRAPHY_SYNC_TOKEN" ]; then
            echo "::error::Missing repository secret BIBLIOGRAPHY_SYNC_TOKEN."
            exit 1
          fi
          if ! gh api \
            --method GET \
            repos/MariosGiannakaras/ThesisBibliography/contents/research-corpus/catalog/package-metadata.json \
            -f "ref=$BIBLIOGRAPHY_REF" \
            --silent; then
            echo "::error::BIBLIOGRAPHY_SYNC_TOKEN cannot read research-corpus metadata at the requested ref."
            echo "The token must remain private and have read-only Contents access to MariosGiannakaras/ThesisBibliography."
            exit 1
          fi

      - name: Checkout bibliography source read-only
        uses: actions/checkout@v4
        with:
          repository: MariosGiannakaras/ThesisBibliography
          ref: ${{ steps.request.outputs.ref }}
          path: .bibliography-source
          token: ${{ secrets.BIBLIOGRAPHY_SYNC_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          lfs: false

      - name: Verify immutable ref and resolve checkout commit
        id: source
        shell: bash
        env:
          REQUESTED_REF: ${{ steps.request.outputs.ref }}
        run: |
          set -euo pipefail
          checkout_commit="$(git -C .bibliography-source rev-parse HEAD)"
          if [[ "$REQUESTED_REF" =~ ^[0-9a-f]{40}$ ]]; then
            if [ "$REQUESTED_REF" != "$checkout_commit" ]; then
              echo "::error::Requested commit does not equal the resolved checkout commit."
              exit 1
            fi
          else
            if ! git -C .bibliography-source show-ref --verify --quiet "refs/tags/$REQUESTED_REF"; then
              echo "::error::Requested ref is not an immutable tag or full SHA: $REQUESTED_REF"
              exit 1
            fi
            tagged_commit="$(git -C .bibliography-source rev-list -n 1 "refs/tags/$REQUESTED_REF")"
            if [ "$tagged_commit" != "$checkout_commit" ]; then
              echo "::error::Tag resolution differs from checkout commit."
              exit 1
            fi
          fi
          echo "commit=$checkout_commit" >> "$GITHUB_OUTPUT"
          echo "short=${checkout_commit:0:12}" >> "$GITHUB_OUTPUT"

      - name: Validate committed upstream packages
        working-directory: .bibliography-source
        run: |
          python tools/package_integrity.py validate thesis-package
          python tools/validate_thesis_package.py
          python tools/research_materials.py validate
          python tools/validate_research_material_review.py
          python tools/export_research_corpus.py validate

      - name: Install complete corpus transactionally
        shell: bash
        env:
          REQUESTED_REF: ${{ steps.request.outputs.ref }}
          CHECKOUT_COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          set -euo pipefail
          expectations=()
          if [ "$REQUESTED_REF" = "bibliography-integration-v2" ]; then
            expectations+=(
              --expect-source-count 583
              --expect-selected-source-count 112
              --expect-research-material-count 19
              --expect-original-pdf-count 280
              --expect-schema-version 1
            )
          fi
          uv run python scripts/bibliography_import.py \
            --package .bibliography-source/research-corpus \
            --requested-ref "$REQUESTED_REF" \
            --checkout-commit "$CHECKOUT_COMMIT" \
            --source-repository .bibliography-source \
            "${expectations[@]}"

      - name: Verify upstream checksums after installation
        working-directory: research/bibliography
        run: |
          sha256sum -c catalog/SHA256SUMS
          (cd citation-ready && sha256sum -c catalog/SHA256SUMS)

      - name: Run consumer validation and tests
        run: |
          uv run python scripts/bibliography_import.py --validate-only
          uv run python scripts/validate_bibliography_usage.py
          uv run python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Remove source checkout before diff
        run: rm -rf .bibliography-source

      - name: Open generated-only bibliography Pull Request
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_REF: ${{ steps.request.outputs.ref }}
          CHECKOUT_COMMIT: ${{ steps.source.outputs.commit }}
          CHECKOUT_SHORT: ${{ steps.source.outputs.short }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- research/bibliography)" ]; then
            echo "research/bibliography already matches the requested immutable corpus."
            exit 0
          fi
          branch="automation/full-corpus-sync-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add research/bibliography
          git commit -m "chore: sync complete bibliography corpus ${CHECKOUT_SHORT}"
          git push origin "HEAD:$branch"
          body_file="$RUNNER_TEMP/bibliography-pr.md"
          uv run python - <<'PY' > "$body_file"
          import json
          from pathlib import Path
          p = json.loads(Path("research/bibliography/IMPORT_INTEGRITY.json").read_text(encoding="utf-8"))
          print("## Generated complete-corpus synchronization")
          print()
          print(f"- requested ref: `{p['requested_ref']}`")
          print(f"- checkout commit: `{p['checkout_commit']}`")
          print(f"- complete-corpus source commit: `{p['corpus_source_commit']}`")
          print(f"- citation-ready source commit: `{p['citation_source_commit']}`")
          print(f"- canonical sources: {p['source_count']}")
          print(f"- citation-ready sources: {p['selected_source_count']}")
          print(f"- research materials: {p['research_material_count']}")
          print(f"- indexed originals: {p['original_pdf_count']}")
          print()
          print("This PR contains only the generated `research/bibliography/` directory. Both upstream checksum manifests, consumer integrity, trust-aware reference validation, and the repository test suite passed before publication. No PDFs or Git LFS objects are imported.")
          PY
          gh pr create \
            --base main \
            --head "$branch" \
            --title "chore: sync complete bibliography corpus ${CHECKOUT_SHORT}" \
            --body-file "$body_file"
