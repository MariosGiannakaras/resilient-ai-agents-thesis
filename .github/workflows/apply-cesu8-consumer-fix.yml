name: Apply CESU-8 consumer fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/byte-preserved-cesu8-sources
          fetch-depth: 0
          persist-credentials: true

      - name: Apply reviewed payload and validate
        shell: bash
        run: |
          set -euo pipefail
          cat .github/cesu8-fix-payload/part* | base64 --decode > "$RUNNER_TEMP/fix.tar.gz"
          tar -xzf "$RUNNER_TEMP/fix.tar.gz" -C .
          rm -rf .github/cesu8-fix-payload
          python -m compileall -q scripts tests core
          python -m unittest discover -s tests -p 'test_*.py' -v
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit \
            -m "fix: support byte-preserved CESU-8 source text" \
            -m "Accept only well-formed CESU-8 surrogate pairs in canonical sources/*.md, preserve imported bytes and upstream checksums, record deterministic encoding paths in IMPORT_INTEGRITY.json, and normalize only search text. All other corpus layers remain strict UTF-8.\n\nValidation: Python compilation and the full repository test suite pass before push."
          git push origin HEAD:fix/byte-preserved-cesu8-sources
