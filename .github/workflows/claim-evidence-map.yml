name: Claim evidence map

on:
  push:
    paths:
      - 'research/bibliography/claim-evidence-map.json'
      - 'scripts/validate_claim_evidence_map.py'
      - 'research/bibliography/citation-ready/**'
      - 'research/bibliography/catalog/sources.csv'
      - 'docs/thesis/CLAIM_EVIDENCE_TREE.md'
      - '.github/workflows/claim-evidence-map.yml'
  pull_request:
    paths:
      - 'research/bibliography/claim-evidence-map.json'
      - 'scripts/validate_claim_evidence_map.py'
      - 'research/bibliography/citation-ready/**'
      - 'research/bibliography/catalog/sources.csv'
      - 'docs/thesis/CLAIM_EVIDENCE_TREE.md'
      - '.github/workflows/claim-evidence-map.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate claim-centred evidence registry
        shell: bash
        run: |
          set +e
          python scripts/validate_claim_evidence_map.py > claim-evidence-validation.txt 2>&1
          status=$?
          cat claim-evidence-validation.txt
          exit "$status"
      - name: Upload validation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: claim-evidence-validation
          path: claim-evidence-validation.txt
