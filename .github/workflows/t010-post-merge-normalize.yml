name: T-010 post-merge normalization

on:
  push:
    branches:
      - workflow/t010-post-merge-normalize
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Normalize T-010 post-merge state
        run: python scripts/t010_post_merge_normalize.py

      - name: Validate project continuity
        run: python scripts/validate_project_continuity.py

      - name: Validate documentation consistency
        run: python scripts/validate_documentation_consistency.py

      - name: Persist normalized state
        if: github.actor != 'github-actions[bot]'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/context/WORK_STATE.json docs/context/TASKS.md docs/context/CURRENT_STATUS.md
          if git diff --cached --quiet; then
            echo 'State already normalized.'
          else
            git commit -m 'T-010: normalize main recovery state after merge'
            git push
          fi
