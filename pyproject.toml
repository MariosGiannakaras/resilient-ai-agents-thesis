[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "resilient-ai-agents-thesis"
version = "0.1.0"
description = "Reproducible research core for the resilient AI agents thesis."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "gymnasium==1.3.0",
    "nicegui[native]==3.16.0",
    "pandas>=3.0.5",
    "plotly>=7.0.0",
]

[project.scripts]
resilient-agents-app = "app.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/resilient_agents", "src/app"]

[tool.uv]
package = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
gridworld-prototype = [
    "minigrid==3.1.0",
]
protocol-v2-pilot = [
    "stable-baselines3==2.9.0",
    "torch==2.9.0",
]
application-packaging = [
    "pyinstaller>=6,<7",
]
